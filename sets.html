<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sets · The Pull Report</title><meta name="description" content="The Pull Report Set Analyzer (free beta): searchable checklists, odds-based rarity tiers, team breakdowns and real sold break-spot prices. Market data, not buying advice."><meta property="og:title" content="The Pull Report · Set Analyzer (Beta)"><meta property="og:description" content="Checklists, rarity tiers, team breakdowns and real sold break-spot prices. Data, not buying advice."><meta property="og:type" content="website"><meta property="og:image" content="og.png"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:site" content="@ThePullReport2"><meta name="theme-color" content="#0b1f3a"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="icon" href="favicon.png" type="image/png"><link rel="stylesheet" href="style.css"><script src="data/home.js"></script><script src="app.js"></script></head><body><main>
<h1>Sets</h1><div class="sub">Pick a category, sort, or search. Each release has its own analyzer page with a Top 5.</div>
<div class="chips" id="chips" role="group" aria-label="Category"></div>
<div class="ctl"><input id="q" type="search" placeholder="Search sets (e.g. Bowman, Chrome, Lorcana)" aria-label="Search sets"><select id="so" aria-label="Sort"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="name">Name A–Z</option></select></div>
<div class="count" id="count"></div><div class="grid" id="l" style="margin-top:8px"></div></main>
<script>header('sets');const HS=window.PR_HOME.sets;let cat=qs('cat');if(!CATS.some(c=>c[0]==cat))cat='';$('#q').value=qs('q');if(qs('sort'))$('#so').value=qs('sort');
function R(){const q=$('#q').value.trim().toLowerCase(),so=$('#so').value;
 $('#chips').innerHTML=[['','All',''],...CATS].map(([k,l])=>`<button type="button" data-k="${k}" class="${k==cat?'on':''}" aria-pressed="${k==cat}">${l}<small>${k?HS.filter(s=>s.cat==k).length:HS.length}</small></button>`).join('');
 $('#chips').querySelectorAll('button').forEach(b=>b.onclick=()=>{cat=b.dataset.k;R()});
 let r=HS.filter(s=>(!cat||s.cat==cat)&&q.split(/\s+/).every(t=>(s.name+' '+s.sport+' '+s.league).toLowerCase().includes(t)));
 r.sort(so=='name'?(a,b)=>a.name.localeCompare(b.name):so=='old'?(a,b)=>a.date.localeCompare(b.date):(a,b)=>b.date.localeCompare(a.date));
 const p=new URLSearchParams();if(cat)p.set('cat',cat);if(q)p.set('q',q);if(so!='new')p.set('sort',so);history.replaceState(null,'','sets.html'+(p+''?'?'+p:''));
 $('#count').textContent=r.length+' set'+(r.length==1?'':'s');
 $('#l').innerHTML=r.map(s=>`<a class="m" href="set.html?id=${s.id}"><h3>${esc(s.sport)} · ${esc(s.league)}</h3><div class="v">${esc(s.name)}${s.pre?' <span class="tag pre">PRE-RELEASE</span>':''}${!s.odds&&!s.comps?' <span class="tag u">checklist only</span>':''}</div><div class="d">${s.cards.toLocaleString()} cards · ${s.autos} autos · ${s.odds?s.ssp+' SSP cards':(s.kind=='tcg'?'<span class="gap">pull rate unknown</span>':'<span class="gap">odds unknown</span>')} · ${s.comps} comps</div><div class="s">${s.pre?'Scheduled':'Released'} ${esc((s.release||'n/a').replace(' (scheduled)',''))}</div></a>`).join('')||'<p class="count">No sets match. <a href="sets.html">Show all sets</a></p>'}
$('#q').addEventListener('input',R);$('#so').addEventListener('change',R);R();</script></body></html>
