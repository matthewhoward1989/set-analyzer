<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Sets · The Pull Report</title><meta name="description" content="The Pull Report Set Analyzer (free beta): searchable checklists, odds-based rarity tiers, team breakdowns and real sold break-spot prices. Market data, not buying advice."><meta property="og:title" content="The Pull Report · Set Analyzer (Beta)"><meta property="og:description" content="Checklists, rarity tiers, team breakdowns and real sold break-spot prices. Data, not buying advice."><meta property="og:type" content="website"><meta property="og:image" content="og.png"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:site" content="@ThePullReport2"><meta name="theme-color" content="#0b1f3a"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="icon" href="favicon.png" type="image/png"><link rel="stylesheet" href="style.css"><script src="data/all.js"></script><script src="app.js"></script></head><body><main>
<h1>Sets</h1><div class="sub">Each release links to its own analyzer page with its Top 5.</div><div class="grid" id="l" style="margin-top:12px"></div></main>
<script>header('sets');$('#l').innerHTML=SETS.map(s=>`<a class="m" href="set.html?id=${s.id}"><h3>${esc(s.sport)} · ${esc(s.league)}</h3><div class="v">${esc(s.name)}${!s.ssp_stats.cards_with_odds&&!(s.comps||[]).length?' <span class="tag u">checklist only</span>':''}</div><div class="d">${s.cards.length.toLocaleString()} cards · ${s.cards.filter(c=>c.auto).length} autos · ${s.ssp_stats.cards_with_odds?s.ssp_stats.ssp_cards+' SSP cards':'<span class="gap">odds unknown</span>'} · ${(s.comps||[]).length} comps</div><div class="s">Released ${esc(s.release||'n/a')}</div></a>`).join('')</script></body></html>
