<h1>Player &amp; character analysis</h1><div class="sub" id="leg">Search any player, Pokémon or character across every tracked set. The legend below matches the category of the result.</div>

<script>header('players');crumbs([['Home','index.html'],['Players',qs('p')?'players.html':''],...(qs('p')?[[qs('p')]]:[])]);let ALL=[],LS=-1;const PS={};PR_PI.forEach((a,i)=>a.forEach(p=>PS[p]=i));const P=PR_PI.flat().sort();$('#pl').innerHTML=P.map(p=>`<option value="${esc(p)}">`).join('');
function R(){const q0=$('#q').value,q=q0.trim().toLowerCase();if(q.length<2){$('#out').innerHTML='';$('#m').textContent='';return}
 let names=P.filter(p=>p.toLowerCase()==q);if(!names.length)names=P.filter(p=>p.toLowerCase().includes(q));
 $('#m').textContent=names.length>1?`${names.length} players match: `+names.slice(0,15).join(', ')+(names.length>15?'…':'')+'. Showing the first.':'';const p=names[0];if(!p){$('#out').innerHTML='<p>No player found.</p>';return}
 if(PS[p]!=LS){const sh=PS[p];$('#out').innerHTML='<p class="count">Loading…</p>';loadAsync('players/'+sh).then(()=>{LS=sh;ALL=SETS.flatMap(s=>s.cards.map(c=>({...c,S:s})));if($('#q').value==q0)R()});return}
 history.replaceState(null,'','?p='+encodeURIComponent(p));const cs=ALL.filter(c=>c.player==p);const K=new Set(cs.map(c=>c.S.kind||'sport'));$('#leg').innerHTML=[K.has('sport')?'<b>Sports sets:</b> <span class="tag au">AUTO</span> marks sets where they sign. Rarity tiers come from published hobby odds: <span class="tag sp">SHORT PRINT</span> 1–5 cases, <span class="tag ssp">SSP</span> 5–25 cases, <span class="tag gr">GRAIL</span> 25+ cases per hobby case. <span class="tag nch">named CH</span> appears only where a source publishes a named case-hit list. Net = eBay formula.':'',K.has('nonsport')?'<b>Non-sport sets (Marvel / Star Wars):</b> same per-hobby-case tiers from Topps-published odds; character in place of player. Net = eBay formula.':'',K.has('tcg')?'<b>TCG (Pokémon, Disney Lorcana):</b> rows are card rarities (Double rare → Mega Hyper Rare). Pull rate unknown (no republishable pull-rate source), so cards show odds unknown. Tiers (if a source exists): <span class="tag sp">SHORT PRINT</span> 1–5, <span class="tag ssp">SSP</span> 5–25, <span class="tag gr">GRAIL</span> 25+ booster cases (6 boxes × 36 packs); sets without a booster box have no tier. Prices are eBay sold (PriceCharting); net = standard TCG marketplace seller fees.':''].filter(Boolean).map(x=>`<div>${x}</div>`).join('');const sp=[...new Set(cs.map(c=>c.S.sport))];const by={};cs.forEach(c=>(by[c.S.id]=by[c.S.id]||[]).push(c));
 $('#out').innerHTML=`<h2>${esc(p)} <span class="count">${cs.length} cards in ${Object.keys(by).length} set(s) · ${[...new Set(cs.map(c=>c.team))].map(esc).join(', ')}</span></h2>`+Object.entries(by).map(([id,a])=>{const s=a[0].S,au=a.some(c=>c.auto),ch=a.some(c=>c.tier),rare=a.filter(c=>c.tier).sort((x,y)=>y.x_cases-x.x_cases)[0];return `<details open><summary>${esc(s.name)} ${au?'<span class="tag au">AUTO</span>':''}${ch?`<span class="tag ${TIERS[rare.tier][0]}">rarest: ${TIERS[rare.tier][1].toUpperCase()} ~1/${rare.x_cases} cs</span> <span class="count">${tierCounts(a)}</span>`:''}${a.some(c=>c.named_case_hit)?'<span class="tag nch">named CH</span>':''}${a.some(c=>c.rc)?'<span class="tag">RC</span>':''} — ${a.length} cards: ${a.map(c=>esc(c.card_no)).filter((v,i,x)=>x.indexOf(v)==i).join(', ')}${!s.ssp_stats.cards_with_odds?(s.kind=='tcg'?' · <span class="gap">pull rate unknown</span>':' · <span class="gap">odds unknown for this set</span>'):''}</summary><div id="p_${id}"></div></details>`}).join('');if(sp.length>1)$('#m').innerHTML+=` <span class="gap">This name appears in ${sp.join(' and ')} sets and may be different people.</span>`;
 const CP=SETS.flatMap(s=>(s.comps||[]).filter(x=>x.player==p).map(x=>({...x,sname:s.name})));if(CP.length){$('#out').insertAdjacentHTML('afterbegin','<h3>Sold comps for '+esc(p)+'</h3><div id="pcomps"></div>');table('pc',[['sname','Set'],['card','Card'],['price','Sold',x=>money(x.price)],['net_est','Net est.',x=>money(x.net_est)+' <span class="count">('+(x.net_formula||'eBay')+')</span>'],['condition','Condition',x=>esc(x.condition||'raw')],['source_type','Source type',x=>esc(x.source_type||x.basis||'')+(x.sales_30d?' · n='+x.sales_30d:'')],['as_of','Last sale'],['source','Source',x=>`<a href="${x.url}">${esc(x.source)}</a>`]],CP,$('#pcomps'))}
 Object.entries(by).forEach(([id,a])=>table('p'+id,[['card_no','Card #'],['set','Card / subset / rarity',c=>(c.card_name&&c.card_name!=c.player?esc(c.card_name)+' · ':'')+esc(c.set)+badges(c)],['team','Team / type'],['comp','Comp or eBay sold (PriceCharting) (net est.)',c=>{const x=compFor(c.S,c);return x?`${money(x.price)} → ${money(x.net_est)} net · ${x.as_of} · <a href="${x.url}">${esc(x.source)}</a>`:'—'}]],a,$('#p_'+id)))}
