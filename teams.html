<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teams · The Pull Report</title><meta name="description" content="The Pull Report Set Analyzer (free beta): searchable checklists, odds-based rarity tiers, team breakdowns and real sold break-spot prices. Market data, not buying advice."><meta property="og:title" content="The Pull Report · Set Analyzer (Beta)"><meta property="og:description" content="Checklists, rarity tiers, team breakdowns and real sold break-spot prices. Data, not buying advice."><meta property="og:type" content="website"><meta property="og:image" content="og.png"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:site" content="@ThePullReport2"><meta name="theme-color" content="#0a1a31"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="favicon.png" type="image/png"><link rel="stylesheet" href="style.css"><script src="data/all.js"></script><script src="app.js"></script></head><body><main>
<h1>Team analysis</h1><div class="sub">Every card from one team across all tracked sets. Relocated or renamed clubs are grouped under the current franchise (e.g. Oakland Raiders → Las Vegas Raiders), and the printed name is kept on each card.</div>
<div class="ctl"><select id="tp"></select></div><div id="sum"></div><div id="out"></div></main>
<script>header('teams');crumbs([['Home','index.html'],['Teams',qs('t')?'teams.html':''],...(qs('t')?[[qs('t').split('|')[1]||qs('t')]]:[])]);const ALL=SETS.flatMap(s=>s.cards.map(c=>({...c,S:s})));const T=[...new Set(ALL.map(teamId))].sort((a,b)=>a.split('|')[1].localeCompare(b.split('|')[1]));
$('#tp').innerHTML='<option value="">Pick a team or Pokémon type…</option>'+['NHL','NFL','NBA','MLB','UEFA','College','Pokémon TCG'].map(l=>`<optgroup label="${l}">${T.filter(t=>t.startsWith(l+'|')).map(t=>`<option value="${esc(t)}">${esc(t.split('|')[1])}</option>`).join('')}</optgroup>`).join('');
function R(){const t=$('#tp').value;history.replaceState(null,'','?t='+encodeURIComponent(t));if(!t){$('#out').innerHTML='';$('#sum').innerHTML='';return}
 const cs=ALL.filter(c=>teamId(c)==t);const by={};cs.forEach(c=>(by[c.S.id]=by[c.S.id]||[]).push(c));
 $('#sum').innerHTML=`<h2>${esc(t.split('|')[1])} <span class="count">${esc(t.split('|')[0])} · ${cs.length} cards in ${Object.keys(by).length} set(s)</span></h2>`;
 $('#out').innerHTML=Object.entries(by).map(([id,a])=>{const s=a[0].S,pub=s.case_hits.status=='published';return `<details open><summary>${esc(s.name)} — ${a.length} cards · ${a.filter(c=>c.auto).length} autos · ${s.ssp_stats.cards_with_odds?tierCounts(a):'<span class="gap">odds unknown</span>'} · ${a.filter(c=>c.rc).length} RCs · ${a.filter(isPar).length} parallel/variation entries · <a href="set.html?id=${id}">set page</a></summary><div id="t_${id}"></div></details>`}).join('')||'<p>No cards.</p>';
 Object.entries(by).forEach(([id,a])=>table('t'+id,[['card_no','Card #'],['player','Player',c=>`<a href="players.html?p=${encodeURIComponent(c.player)}">${esc(c.player)}</a>${badges(c)}`],['team','Printed team'],['set','Subset / variation'],['comp','Comp',c=>{const x=compFor(c.S,c);return x?money(x.price)+' → '+money(x.net_est)+' net':'—'}]],a,$('#t_'+id)))}
$('#tp').onchange=R;$('#tp').value=qs('t');R();</script></body></html>
